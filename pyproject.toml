[project]
name = "call-me-maybe"
version = "1.0.0"
description = "function calling tool"
readme = "README.md"
authors = [
    { name = "agalvan-" }
]
requires-python = ">=3.12"
dependencies = [
    "llm-sdk",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.4",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flake8]
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
]
max-line-length = 80

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
